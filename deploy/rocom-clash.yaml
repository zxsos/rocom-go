# rocom-go 客户端代理配置（hysteria2）
#
# 这是**模板**：里面的服务器地址与密码都是占位符，真值放你自己的副本里，
# 别把填好的版本提交进仓库。
#
# 使用前必看:
#   1. 需开启 TUN/增强模式,否则抓不到游戏流量(iOS 小火箭本身即 VPN,无需设置)
#   2. 防火墙 / 云安全组放行的是 **UDP** 11443,不是 TCP
#   3. 服务端无需手动加 -skip-self-ip:启用 -hy2-addr 时 run.sh 会自动带
#      `-skip-self-ip=false`(见 scripts/deploy.sh 的 hy2 块)
#   4. PACKAGE-NAME / PROCESS-NAME 仅 Android + PC 有效;
#      iOS 沙盒限制拿不到包名,小火箭导入时会自动降级为只用 DST-PORT,属正常
#
# 与旧版 SOCKS5 的差异(排障时容易误判,先记下):
#   - 密码在 hy2 隧道**内部**传输,不再是 RFC1929 明文;但白名单仍然必要 ——
#     密码只挡「连进来」,挡不住扫描器把 UDP 端口打满。
#   - 服务端已关闭 UDP 转发(游戏只用 TCP 8195),故本文件 `udp: false` 是**必须**的,
#     改成 true 会连不上而不是变快。
#   - 不支持多用户:整个内嵌 hy2 只有**一把**密码,多台设备共用它。要单独吊销某台,
#     只能换密码并让所有设备重新导入配置。
#   - 不支持 masquerade(伪装站点)。被探测时就是裸露的 hy2 端点特征,
#     这是相对独立 hysteria 部署的能力退化,不是配置漏填。

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090

tun:
  enable: true
  stack: system
  dns-hijack:
    - 198.18.0.2:53
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxies:
  - name: "ROCOM hy2"
    type: hysteria2
    server: "203.0.113.10"        # ← 改成你的服务器地址
    port: 11443
    password: "改成你的密码"        # ← 对应服务端 ROCOM_HY2_PASS / -hy2-pass
    udp: false                    # 服务端 DisableUDP=true,必须保持 false
    # 服务端复用 Web 那份证书(LE 签发,SAN 只有域名、没有 IP)。
    # 按 IP 连 → 只能 skip-cert-verify: true;
    # 按域名连 → 可改 skip-cert-verify: false 并加 sni: <你的域名>。
    skip-cert-verify: true

# ⚠️ 这里曾经有第二条「代理通道」(11444)。它**连不上**,已删除:
#    内嵌 hy2 的 Config 只有一个 Addr 字段、服务端只有一个 -hy2-addr flag,
#    单个进程无法同时监听两个 UDP 端口。想要第二条独立通道,只能
#    再跑一个 rocom-go 实例(另配端口与数据路径),而不是在这份文件里改个数字。
#
# 公网暴露的加固顺序(从省事到最稳):
#   1) 服务端 -hy2-allow "1.2.3.4,..."          只放行手机出口 IP,IP 变了要改
#   2) -hy2-max-conns 64                        限制并发,防连接风暴打垮同进程 Web
#   3) -hy2-addr <内网/VPN IP>:11443           公网根本扫不到,最稳

proxy-groups:
  - name: "抓包通道"
    type: select
    proxies:
      - "ROCOM hy2"
      - DIRECT

rules:
  # 按包名/进程名精确匹配 —— 需 Clash.Meta / fclash 支持 AND 与 PACKAGE-NAME。
  # 当前客户端不支持,已全部注释;换用支持的分流客户端可放开。
  #
  # # Windows
  # - AND,((PROCESS-NAME,nrc-win64-shipping.exe),(DST-PORT,8195)),抓包通道
  # # macOS PlayCover(包名与安卓相同)
  # - AND,((PROCESS-NAME,com.tencent.nrc),(DST-PORT,8195)),抓包通道
  # # Android
  # - AND,((PACKAGE-NAME,com.tencent.nrc),(DST-PORT,8195)),抓包通道
  # # PC 模拟器(需客户端开启「进程名识别」)
  # - AND,((PROCESS-NAME,dnplayer.exe),(DST-PORT,8195)),抓包通道     # 雷电
  # - AND,((PROCESS-NAME,MEmu.exe),(DST-PORT,8195)),抓包通道         # 逍遥
  # - AND,((PROCESS-NAME,MuMuPlayer.exe),(DST-PORT,8195)),抓包通道   # MuMu
  # - AND,((PROCESS-NAME,Nox.exe),(DST-PORT,8195)),抓包通道          # 夜神
  # - AND,((PROCESS-NAME,HD-Player.exe),(DST-PORT,8195)),抓包通道    # 蓝叠

  # 核心:游戏流量走抓包通道(全客户端通用,别删)
  - DST-PORT,8195,抓包通道

  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
