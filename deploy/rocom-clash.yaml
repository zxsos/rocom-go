# rocom-capture 客户端代理配置
# 服务端:103.236.77.188:11443 (hysteria2)
#
# 使用前必看:
#   1. 需开启 TUN/增强模式,否则抓不到游戏流量(iOS 小火箭本身即 VPN,无需设置)
#   2. 防火墙放行 UDP 11443(不是 TCP)
#   3. 服务端 rocom-capture 必须加 -skip-self-ip=false,否则抓不到包
#   4. PACKAGE-NAME / PROCESS-NAME 仅 Android + PC 有效;
#      iOS 沙盒限制拿不到包名,小火箭导入时会自动降级为只用 DST-PORT,属正常

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090

tun:
  enable: true
  stack: system
  dns-hijack:
    - 198.18.0.2:53
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxies:
  - name: "ROCOM hy2"
    type: hysteria2
    server: "103.236.77.188"
    port: 11443
    password: "改成你的密码"
    udp: false
    skip-cert-verify: true   # 自签证书;挂域名+正规证书后改 false 并加 sni

  - name: "SOCKS5 通道"
    type: socks5
    server: "103.236.77.188"
    port: 10809
    udp: false          # 服务端支持 UDP associate 时可改 true(QUIC/DNS 需要)
    username: "改成你的用户名"
    password: "改成你的密码"

    # ⚠ 公网暴露时必看:RFC 1929 认证是**明文传输**的(TCP 上裸奔),
    #   有密码只能挡住不抓包的扫描器,挡不住任何能碰到这段流量的人。
    #   服务端务必加来源 IP 限制,例如:
    #     -socks5-allow "1.2.3.4,10.0.0.0/8"
    #   更稳的做法是只监听内网/VPN IP(如 -socks5-addr 100.64.0.1:10809),
    #   公网完全访问不到。

proxy-groups:
  - name: "抓包通道"
    type: select
    proxies:
      - "ROCOM hy2"
      - DIRECT

  - name: "代理通道"
    type: select
    proxies:
      - "SOCKS5 通道"
      - DIRECT

rules:
  # 按包名/进程名精确匹配 —— 需 Clash.Meta / fclash 支持 AND 与 PACKAGE-NAME。

  # 当前客户端不支持,已全部注释;换用支持的分流客户端可放开。



  # # Windows

  # - AND,((PROCESS-NAME,nrc-win64-shipping.exe),(DST-PORT,8195)),抓包通道



  # # macOS PlayCover(包名与安卓相同)

  # - AND,((PROCESS-NAME,com.tencent.nrc),(DST-PORT,8195)),抓包通道



  # # Android

  # - AND,((PACKAGE-NAME,com.tencent.nrc),(DST-PORT,8195)),抓包通道



  # # PC 模拟器(需客户端开启「进程名识别」)

  # - AND,((PROCESS-NAME,dnplayer.exe),(DST-PORT,8195)),抓包通道     # 雷电

  # - AND,((PROCESS-NAME,MEmu.exe),(DST-PORT,8195)),抓包通道         # 逍遥

  # - AND,((PROCESS-NAME,MuMuPlayer.exe),(DST-PORT,8195)),抓包通道   # MuMu

  # - AND,((PROCESS-NAME,Nox.exe),(DST-PORT,8195)),抓包通道          # 夜神

  # - AND,((PROCESS-NAME,HD-Player.exe),(DST-PORT,8195)),抓包通道    # 蓝叠



  # 核心:游戏流量走抓包通道(全客户端通用,别删)

  - DST-PORT,8195,抓包通道

  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT

  # 「代理通道」默认不接任何流量(未出现在上面的规则里)。
  # 想让非游戏流量走 socks5 时,把上面 MATCH,DIRECT 改成 MATCH,代理通道。
  # 也可按域名细分,例如:
  #   - DOMAIN-SUFFIX,github.com,代理通道
  #   - DOMAIN-SUFFIX,google.com,代理通道
