name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build frontend
        run: |
          cd web && npm install && npm run build
      
      - name: Tidy modules
        run: go mod tidy
      
      - name: Build Linux binary
        run: CGO_ENABLED=1 go build -o rocom-go-linux-amd64 ./cmd/rocom-go
      
      - name: Check version matches tag
        id: check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(cat VERSION)
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" = "$TAG" ]; then
            echo "match=true" >> $GITHUB_OUTPUT
          else
            echo "match=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.check.outputs.match == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: rocom-go-linux-amd64
          generate_release_notes: true
