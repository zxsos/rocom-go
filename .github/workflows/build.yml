name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build frontend
        run: |
          cd web && npm install && npm run build
      
      - name: Build Linux amd64
        run: CGO_ENABLED=1 GOARCH=amd64 go build -ldflags="-s -w" -o rocom-go-linux-amd64 ./cmd/rocom-go
      
      - name: Install ARM64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Build Linux arm64
        run: CGO_ENABLED=1 GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -ldflags="-s -w" -o rocom-go-linux-arm64 ./cmd/rocom-go
      
      - name: Check version matches tag
        id: check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(cat VERSION)
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" = "$TAG" ]; then
            echo "match=true" >> $GITHUB_OUTPUT
          else
            echo "match=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.check.outputs.match == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rocom-go-linux-amd64
            rocom-go-linux-arm64
          name: Releases ${{ github.ref_name }}
          generate_release_notes: true
