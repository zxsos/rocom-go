# 云原生开发(沙盒)环境:直接拉取预构建镜像,开环境即秒开,不再每次重建。
#
# 镜像内容见 .ide/Dockerfile(Go 1.26.4 + cgo 依赖 + Node + Playwright Chromium),
# 由下方 master.push 流水线构建并推送到 CNB Docker 制品库:
#   改 .ide/Dockerfile → 推送到 master → 流水线自动重建并覆盖 dev-env:latest
#   → 之后再开环境就是新镜像。分支上改 Dockerfile 不会触发,合回 master 才会。
#
# ⚠️ 沙盒容器没有 CAP_NET_RAW/NET_ADMIN,**无法实时抓包**(-iface 会报
# operation not permitted)。在沙盒里请用 -pcap <文件> 离线回放调试。

# 应用镜像(抓包服务,根目录 Dockerfile)的**唯一定义**。两个入口共用它:
#   · web_trigger —— 仓库页 → 流水线/构建 → 手动触发里点按钮(名字见下);
#   · api_trigger —— 命令行 / OPENAPI StartBuild:
#       cnb build start-build --repo <slug> --branch master --event api_trigger
#     (web_trigger 用命令行发不了:`--event` 必须是 `api_trigger` 或 `api_trigger_*`)
#
# 共用而不是复制两份:复制迟早漂移,表现为「按钮打的镜像和命令行打的不是同一个」。
# 锚点挂在**点号开头**的顶层键上 —— 点号不是分支名,不会被当成触发规则(见官方
# 《简化配置文件》:锚点/别名只在单个文件内有效)。
#
# 不挂 push(2026-09-11 改):这条要跑一整轮 docker build + push(数十秒到数分钟,还占一个
# docker 服务),而它的产物只是「给外部 docker pull 的那份镜像」——**日常改代码推上来并不需要
# 重打一次**。原先挂在 push 上(还带一大串 ifModify)的实际后果是几乎每次提交都重建,
# 甚至要靠 lock 互相取消同一批构建。改成主动触发后:要发镜像时触发一次,平时一次都不跑。
#
# 主动触发**不做 ifModify 过滤**:既然是人点的/命令发的,就是要重打一次 ——「代码没变也想重打」
# 不再需要随便碰一个文件提交(那正是之前唯一的办法)。
.app-image: &app-image
  - name: 构建并推送应用镜像
    services:
      - docker
    # 两次构建并发时会**互相覆盖 latest**:慢的那次后推送,把旧镜像顶回 latest
    # (2026-09-11 实际踩到:一次构建卡在慢速 apk 源上,若不停掉它,新版本推完 latest
    #  还会被它覆盖)。故同 key 只保留最新一次:正在跑的取消、排队中的取消。
    lock:
      key: rocom-go-image
      cancel-in-progress: true
      cancel-in-wait: true
    stages:
      - name: docker build
        script: |
          set -e
          IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
          VER="$(tr -d '[:space:]' < VERSION)"
          # 除了 latest 再打一个 VERSION 标签(v4.2.0):只留 latest 没法回滚到具体版本
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:v${VER}" -f Dockerfile .
      - name: docker push
        script: |
          set -e
          IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
          VER="$(tr -d '[:space:]' < VERSION)"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:v${VER}"

$: # 兜底匹配所有分支
  vscode:
    - docker:
        # 只写 image、不写 build:写了 build 每次开环境都会构建一次(数分钟);
        # 预构建镜像走拉取,是"秒开"的关键。
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/dev-env:latest
      services:
        - vscode
      env:
        # 打开环境时在终端自动执行一次,顺带自检工具链是否齐活
        CNB_WELCOME_CMD: go version && node -v && ls /root/.cache/ms-playwright
      stages:
        # node_modules 被 .gitignore 忽略、不随工作区备份,每次新建环境都要装
        - name: 前端依赖
          script: cd web && npm install
        # 镜像里已内置与 playwright@1.62.1 匹配的 Chromium;这里再跑一次是为了
        # 升级 web/package.json 里的 playwright 后能自动补装新 revision。
        # 已存在时是秒级空操作,离线/无网时跳过而不是让环境起不来。
        - name: 浏览器
          script: cd web && (npx playwright install chromium || echo "跳过:浏览器已内置或当前离线")

  # 应用镜像的两个入口,共用上面 `.app-image` 那一段(要改动请只改那一处)。
  web_trigger: *app-image # 仓库页「手动触发」里的按钮
  api_trigger: *app-image # 命令行 / OPENAPI StartBuild

# 重建镜像的流水线:挂在**本仓库的默认分支 master** 上。
# ⚠️ CNB 的顶层键就是分支名(glob),`main` 只是"名字叫 main 的分支"、并非默认分支别名 ——
# 本仓库默认分支是 master,若写成 main 这条流水线永不触发,开发环境镜像也就永远建不出来。
# 见 CNB 文档 build/trigger-rule.md(分支匹配)。
master:
  push:
    - name: 重建并推送开发环境镜像
      services:
        - docker
      # 只有开发环境定义变了才重建,业务代码提交不碰镜像
      ifModify:
        - .ide/Dockerfile
      stages:
        - name: docker build
          script: docker build -f .ide/Dockerfile -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/dev-env:latest .
        - name: docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/dev-env:latest
