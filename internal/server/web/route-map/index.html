<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 跑图收集路线</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">洛克王国 · 跑图收集路线 <span class="sub">数据来自 B站泽口博士</span></div>
  <div class="controls">
    <span class="ctl">
      <label>底图</label>
      <input type="range" id="bgOpacity" min="0.1" max="1" step="0.05" value="1" title="底图不透明度">
    </span>
    <span class="ctl">
      <label>线宽</label>
      <input type="range" id="lineWidth" min="1" max="8" step="1" value="3">
    </span>
    <span class="ctl">
      <label>点</label>
      <input type="range" id="pointSize" min="1" max="12" step="1" value="4">
    </span>
    <span class="ctl chk"><label><input type="checkbox" id="showLines" checked>线</label></span>
    <span class="ctl chk"><label><input type="checkbox" id="showPoints" checked>点</label></span>
    <span class="ctl chk"><label><input type="checkbox" id="showMarks" checked>起终点</label></span>
  </div>
</header>
<aside id="panel">
  <div class="panel-head">
    <b>路线列表</b>
    <span class="panel-btns">
      <button id="btnAll" title="全部选中">全选</button>
      <button id="btnNone" title="全部取消">清空</button>
    </span>
  </div>
  <div id="routeList"></div>
</aside>
<main>
  <canvas id="map"></canvas>
  <div id="hint">滚轮缩放 · 拖拽平移 · 双击复位视图</div>
</main>
<footer id="status">
  <span id="zoom">缩放 —</span>
  <span id="coords">坐标 —</span>
  <span id="sel">已选 0 条</span>
</footer>
<script src="app.js"></script>
</body>
</html>
